# Default values for injecto
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of replicas for the Injecto deployment
replicaCount: 1

# Pod Disruption Budget - disabled by default because this chart defaults to a
# single replica (a PDB would block node drains). Enable with minAvailable: 1
# where the service runs >=2 replicas (as it does in production), or
# maxUnavailable: 0 to deliberately protect a single stateful replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

image:
  # Container image repository
  repository: ghcr.io/devopsgroupeu/injecto
  # Image pull policy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

# Image pull secrets for private registries
imagePullSecrets: []
  # - name: ghcr-secret

# Override the default chart name
nameOverride: ""
# Override the full release name
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Annotations to add to the pod
podAnnotations: {}
# Labels to add to the pod
podLabels: {}

podSecurityContext:
  # Run as non-root user (matches Dockerfile)
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  # Drop all capabilities
  capabilities:
    drop:
    - ALL
  # Read-only root filesystem
  readOnlyRootFilesystem: true
  # Run as non-root
  runAsNonRoot: true
  runAsUser: 1000
  # Prevent privilege escalation
  allowPrivilegeEscalation: false

service:
  # Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Service port
  port: 8000
  # Target container port
  targetPort: 8000
  # Annotations for the service
  annotations: {}

# Prometheus metrics, served by a second listener on a dedicated port. Kept off
# the API port on purpose: the endpoint is unauthenticated, so it must never be
# reachable through an ingress. Scraped in-cluster via the ServiceMonitor below.
metrics:
  enabled: true
  port: 9090
  # Namespaces allowed to scrape the metrics port when networkPolicy.enabled is
  # set. The chart adds this rule itself, so overriding networkPolicy.ingress
  # never drops it. Point it at wherever Prometheus runs: "monitoring" for this
  # cluster's kube-prometheus-stack; e.g. kube-system for Azure Monitor managed
  # Prometheus, gmp-system for GKE Managed Prometheus.
  scrapeNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

# ServiceMonitor for the Prometheus Operator. Rendered only on a cluster that
# serves monitoring.coreos.com/v1 (the Prometheus Operator CRDs), so installing
# the chart on a cluster without them does not fail. The cluster's Prometheus
# discovers ServiceMonitors in every namespace with no label selector
# (serviceMonitorSelectorNilUsesHelmValues: false).
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

ingress:
  # Enable ingress
  enabled: false
  # Ingress class name
  className: ""
  # Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  # Ingress hosts configuration
  hosts:
    - host: injecto.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS configuration
  tls: []
  #  - secretName: injecto-tls
  #    hosts:
  #      - injecto.example.com

resources:
  # Resource limits
  limits:
    cpu: 500m
    memory: 512Mi
  # Resource requests
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  # Enable liveness probe
  enabled: true
  # HTTP GET request configuration
  httpGet:
    path: /health
    port: http
  # Initial delay before probe starts
  initialDelaySeconds: 30
  # Probe interval
  periodSeconds: 10
  # Probe timeout
  timeoutSeconds: 5
  # Success threshold
  successThreshold: 1
  # Failure threshold
  failureThreshold: 3

readinessProbe:
  # Enable readiness probe
  enabled: true
  # HTTP GET request configuration
  httpGet:
    path: /health
    port: http
  # Initial delay before probe starts
  initialDelaySeconds: 15
  # Probe interval
  periodSeconds: 10
  # Probe timeout
  timeoutSeconds: 5
  # Success threshold
  successThreshold: 1
  # Failure threshold
  failureThreshold: 3

autoscaling:
  # Enable horizontal pod autoscaler
  enabled: false
  # Minimum number of replicas
  minReplicas: 1
  # Maximum number of replicas
  maxReplicas: 10
  # Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # Target memory utilization percentage (optional)
  # targetMemoryUtilizationPercentage: 80

# The emptyDir mounted at /tmp, the only writable path (the root filesystem is
# read-only): per-request scratch dirs, uploads, result ZIPs and the templates
# cache. With sizeLimit the kubelet evicts the pod when it outgrows the limit,
# instead of one oversized request filling the node's disk.
tmpDir:
  sizeLimit: 1Gi

# Additional volumes
volumes: []
  # - name: temp-dir
  #   emptyDir: {}

# Additional volume mounts
volumeMounts: []
  # - name: temp-dir
  #   mountPath: /tmp

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity rules for pod assignment
affinity: {}

# Environment variables
env:
  # Persistent cache for the shallow-cloned infra-templates repo.
  # /tmp is an emptyDir mount in this chart (writable despite
  # readOnlyRootFilesystem) — ephemeral per pod, shared across requests.
  - name: TEMPLATES_CACHE_DIR
    value: "/tmp/injecto-templates-cache"
  # Comma-separated https://<host>/<owner>/ entries every cloning endpoint
  # (/process, /process-git-download, /catalog) is limited to. Unset disables
  # cloning (503) instead of allowing any URL.
  - name: CATALOG_REPO_ALLOWLIST
    value: "https://github.com/devopsgroupeu/"
  # - name: LOG_LEVEL
  #   value: "info"
  # - name: DEBUG
  #   value: "false"

# Environment variables from ConfigMaps or Secrets
envFrom: []
  # - configMapRef:
  #     name: injecto-config
  # - secretRef:
  #     name: injecto-secrets

# Injecto-specific configuration
injecto:
  # API server configuration
  api:
    # Enable API mode (always true for Kubernetes deployment)
    enabled: true
    # Host to bind to
    host: "0.0.0.0"
    # Port to bind to (should match service.targetPort)
    port: 8000
    # Enable debug mode
    debug: false

  # Additional command-line arguments
  # These are appended to the base command
  extraArgs: []
    # - "--debug"

# Shared token the backend sends as X-Service-Token. Injecto refuses to start
# without one; name the Secret that holds it here, or set SERVICE_TOKEN in env.
# INJECTO_AUTH_DISABLED=true in env runs without a token (local dev only).
serviceToken:
  existingSecret: ""
  secretKey: SERVICE_TOKEN

# Network policy — restrict who can reach Injecto (defense-in-depth alongside the
# X-Service-Token auth). Enable in prod GitOps. Ingress-only, so Injecto keeps
# egress for git clone / DNS.
networkPolicy:
  enabled: false
  ingress:
    # Only the OpenPrime backend may call Injecto, on the service port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-app-backend
      ports:
        - protocol: TCP
          port: 8000
