apiVersion: v1
kind: Service
metadata:
  name: {{ include "injecto.fullname" . }}
  labels:
    {{- include "injecto.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    {{- /* An externally reachable Service type would expose the unauthenticated
    metrics port; metrics-service.yaml serves it in-cluster instead. */}}
    {{- if and .Values.metrics.enabled (eq .Values.service.type "ClusterIP") }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "injecto.selectorLabels" . | nindent 4 }}
